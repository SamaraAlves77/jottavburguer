<!-- 🛒 CARRINHO -->
<div id="carrinho-modal" class="modal">
    <div class="modal-content">

        <span class="fechar-modal">×</span>

        <div class="carrinho-header">
            <h3>🛒 Seu Pedido</h3>
        </div>

        <!-- ITENS -->
        <div id="carrinho-itens" class="carrinho-itens"></div>

        <!-- TOTAL -->
        <div class="carrinho-total-container">
            <strong>Total: R$ <span id="carrinho-total">0,00</span></strong>
        </div>

        <!-- FORM -->
        <div class="carrinho-finalizar">

            <select id="forma-pagamento"></select>

            <input type="text" id="nome-cliente" placeholder="Seu nome">
            <input type="text" id="bairro-cliente" placeholder="Bairro">
            <input type="text" id="endereco-cliente" placeholder="Endereço">

            <textarea id="observacoes-pedido" placeholder="Observações"></textarea>

            <button id="btn-anexar-localizacao">📍 Enviar localização</button>
            <p id="localizacao-status"></p>

            <button id="btn-finalizar-pedido">
                🚀 Finalizar pelo WhatsApp
            </button>

        </div>

    </div>
</div>

<!-- ⚙️ CUSTOMIZAÇÃO -->
<div id="customizacao-modal" class="modal">
    <div class="modal-content">

        <span class="fechar-customizacao">×</span>

        <h3 id="item-customizacao-nome"></h3>

        <div id="adicionais-opcoes-lista"></div>

        <div class="customizacao-resumo">
            <p>Total: R$ <span id="preco-total-item-customizacao">0,00</span></p>
        </div>

        <button id="btn-adicionar-customizado">
            Adicionar ao carrinho
        </button>

    </div>
</div>
