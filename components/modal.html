<div id="carrinho-modal" class="modal">
    <div class="modal-content">

        <span class="fechar-modal">×</span>

        <!-- 🔥 HEADER MELHORADO -->
        <div class="carrinho-header">
            <h3>🛒 Seu Pedido</h3>
            <p class="carrinho-sub">Confira seus itens antes de finalizar</p>
        </div>

        <div class="carrinho-itens" id="carrinho-itens"></div>

        <div class="carrinho-total-container">
            <span>Total:</span>
            <strong>R$ <span id="carrinho-total">0,00</span></strong>
        </div>

        <!-- 🔥 AVISO MELHORADO -->
        <div class="aviso-taxa-entrega">
            <i class="fas fa-motorcycle"></i>
            <span>Taxa de entrega calculada no atendimento</span>
        </div>

        <div class="carrinho-finalizar">

            <h4>📋 Dados para entrega (opcional)</h4>

            <select id="forma-pagamento" required></select>

            <input type="text" id="nome-cliente" placeholder="Seu nome">

            <input type="text" id="bairro-cliente" placeholder="Bairro">

            <input type="text" id="endereco-cliente" placeholder="Rua, número e referência">

            <div class="opcoes-pedido">
                <h4>📝 Observações</h4>
                <textarea id="observacoes-pedido" placeholder="Ex: Sem cebola, troco para R$ 50" rows="3"></textarea>
            </div>

            <div class="campo-localizacao">
                <button type="button" id="btn-anexar-localizacao" class="btn-secundario">
                    📍 Enviar localização (opcional)
                </button>
                <p id="localizacao-status"></p>
            </div>

            <!-- 🔥 BOTÃO MAIS FORTE -->
            <button id="btn-finalizar-pedido" class="btn-finalizar">
                🚀 Finalizar pelo WhatsApp
            </button>

        </div>
    </div>
</div>

<!-- ⚠️ MANTIDO (VAMOS USAR DEPOIS) -->
<div id="customizacao-modal" class="modal">
    <div class="modal-content">
        <span class="fechar-customizacao">×</span>

        <div class="adicionais-opcoes">
            <h3>Customizar <span id="item-customizacao-nome"></span></h3>
            <h4>Adicionais:</h4>
            <div id="adicionais-opcoes-lista"></div>
        </div>

        <div class="customizacao-resumo">
            <p>Base: R$ <span id="preco-base-customizacao">0,00</span></p>
            <p>Extras: R$ <span id="preco-adicionais-customizacao">0,00</span></p>
            <p class="customizacao-total">Total: R$ <span id="preco-total-item-customizacao">0,00</span></p>
        </div>

        <button id="btn-adicionar-customizado">Adicionar ao carrinho</button>
    </div>
</div>
