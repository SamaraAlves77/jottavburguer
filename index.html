<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Virtual</title>
    <!-- Favicon com o hamburguer pixel art -->
    <link rel="icon" type="image/png" href="hamburguer.png">
    <link rel="stylesheet" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
    <div class="landing-page-container">
        <div class="landing-card">
            <div class="card-left" id="card-left">
                <img src="imagens/jottav_burguer.png" alt="Logo" class="logo-landing" id="logo-landing">
                <h1 class="slogan" id="slogan">O verdadeiro sabor do hambúrguer artesanal!</h1>
            </div>
            <div class="card-right" id="card-right"></div>
        </div>
    </div>

<script>
// SVGs inline — sem dependência de FontAwesome
const SVG_INSTAGRAM = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28.87 28.87" width="22" height="22" style="flex-shrink:0">
  <defs><linearGradient id="ig-grad" x1="-1.84" x2="32.16" y1="30.47" y2="-3.03" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fed576"/><stop offset=".26" stop-color="#f47133"/>
    <stop offset=".61" stop-color="#bc3081"/><stop offset="1" stop-color="#4c63d2"/>
  </linearGradient></defs>
  <rect width="28.87" height="28.87" rx="6.48" fill="url(#ig-grad)"/>
  <path d="M10 5h9c.2.1.5.1.7.2a4.78 4.78 0 0 1 3.8 3.3 8 8 0 0 1 .3 1.5v8.8a6.94 6.94 0 0 1-1.2 3.1 5.51 5.51 0 0 1-4.5 1.9h-7.5a5.49 5.49 0 0 1-3.7-1.2A5.51 5.51 0 0 1 5 18.14v-7a7.57 7.57 0 0 1 .1-1.5 4.9 4.9 0 0 1 3.8-4.3zm-3.1 9.5v3.9a3.42 3.42 0 0 0 3.7 3.7q3.9.15 7.8 0c2.3 0 3.6-1.4 3.7-3.7q.15-3.9 0-7.8a3.52 3.52 0 0 0-3.7-3.7q-3.9-.15-7.8 0a3.42 3.42 0 0 0-3.7 3.7z" fill="#fff"/>
  <path d="M9.64 14.54a4.91 4.91 0 0 1 4.9-4.9 5 5 0 0 1 4.9 4.9 4.91 4.91 0 0 1-4.9 4.9 5 5 0 0 1-4.9-4.9zm4.9-3.1a3.05 3.05 0 1 0 3 3 3 3 0 0 0-3-3z" fill="#fff"/>
  <path d="M18.34 9.44a1.16 1.16 0 0 1 1.2-1.2 1.29 1.29 0 0 1 1.2 1.2 1.2 1.2 0 0 1-2.4 0z" fill="#fff"/>
</svg>`;

const SVG_WHATSAPP = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="22" height="22" style="flex-shrink:0">
  <rect width="28" height="28" rx="6" fill="#25D366"/>
  <path d="M14 4.5C8.75 4.5 4.5 8.75 4.5 14c0 1.7.45 3.3 1.23 4.7L4.5 23.5l4.96-1.2A9.44 9.44 0 0 0 14 23.5c5.25 0 9.5-4.25 9.5-9.5S19.25 4.5 14 4.5zm5.4 13.3c-.22.62-1.3 1.18-1.8 1.25-.46.07-1.04.1-1.67-.1-.38-.13-.88-.3-1.52-.58-2.67-1.15-4.4-3.85-4.53-4.03-.13-.17-1.06-1.41-1.06-2.68s.67-1.9.91-2.16c.24-.26.52-.32.7-.32l.5.01c.16 0 .38-.06.6.45l.85 2.07c.07.17.12.37.02.58l-.3.5-.45.52c-.15.16-.3.33-.13.64.17.3.76 1.25 1.63 2.02 1.12 1 2.06 1.3 2.36 1.45.3.15.47.12.65-.07l.78-.9c.2-.24.4-.17.67-.07l2.13.99c.3.14.5.22.57.34.07.13.07.73-.15 1.35z" fill="#fff"/>
</svg>`;

const SVG_CARDAPIO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" style="flex-shrink:0">
  <rect x="3" y="5" width="18" height="2" rx="1" fill="#fff"/>
  <rect x="3" y="11" width="18" height="2" rx="1" fill="#fff"/>
  <rect x="3" y="17" width="13" height="2" rx="1" fill="#fff"/>
</svg>`;

const ICONES = {
    instagram: SVG_INSTAGRAM,
    whatsapp:  SVG_WHATSAPP,
    cardapio:  SVG_CARDAPIO,
};

async function carregarLanding() {
    let cfg = null;
    try {
        const r = await fetch('data/config.json?v=' + Date.now());
        if (r.ok) cfg = await r.json();
    } catch(e) {}

    const est    = cfg?.estabelecimento || {};
    const land   = cfg?.landing || {};
    const botoes = land.botoes || [
        { tipo: 'instagram', texto: 'Instagram', link: '#', ativo: true },
        { tipo: 'whatsapp',  texto: 'WhatsApp',  link: '#', ativo: true },
        { tipo: 'cardapio',  texto: 'Cardápio',  link: 'cardapio.html', ativo: true }
    ];

    // Título
    if (est.nome) document.title = est.nome + ' - Cardápio Virtual';

    // Logo
    const logoEl = document.getElementById('logo-landing');
    if (est.logo) logoEl.src = est.logo;

    // Slogan
    const sloganEl = document.getElementById('slogan');
    if (est.slogan) sloganEl.textContent = est.slogan;

    // 3 cores do cartão de visita
    const leftEl = document.getElementById('card-left');
    if (land.cor_esquerda) leftEl.style.backgroundColor = land.cor_esquerda;

    const rightEl2 = document.getElementById('card-right');
    if (land.cor_direita) rightEl2.style.backgroundColor = land.cor_direita;

    if (land.cor_fundo) document.body.style.backgroundColor = land.cor_fundo;

    // Botões com SVG inline
    const rightEl = document.getElementById('card-right');
    rightEl.innerHTML = '';

    botoes.filter(b => b.ativo !== false).forEach(btn => {
        const a = document.createElement('a');
        a.href = btn.link || '#';
        a.className = 'social-btn ' + (btn.tipo || 'cardapio');
        if (btn.tipo === 'instagram' || btn.tipo === 'whatsapp') a.target = '_blank';

        // Ícone: customizado (SVG externo) ou padrão inline
        if (btn.icone && btn.icone !== '') {
            a.innerHTML = `<img src="${btn.icone}" width="22" height="22" style="flex-shrink:0;object-fit:contain"><span>${btn.texto}</span>`;
        } else {
            const icon = ICONES[btn.tipo] || SVG_CARDAPIO;
            a.innerHTML = `${icon}<span>${btn.texto}</span>`;
        }
        rightEl.appendChild(a);
    });
}

carregarLanding();
</script>
</body>
</html>
