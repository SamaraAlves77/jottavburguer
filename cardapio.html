<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
    <link rel="icon" type="image/png" href="assets/img/hamburguer.png">
    <link rel="stylesheet" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/cardapio.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div id="navbar-container"></div>

    <div class="cardapio-layout">

        <!-- Sidebar desktop -->
        <nav class="cardapio-sidebar" id="cardapio-sidebar"></nav>

        <!-- Conteúdo principal -->
        <div class="cardapio-main">

            <!-- ====== VIEW: HOME ====== -->
            <div id="view-home" class="view active">
                <!-- Carousel -->
                <div id="carousel-container" class="carousel-section"></div>

                <!-- Banners de ação -->
                <div id="banners-section" class="banners-section"></div>

                <!-- Grid de categorias -->
                <div class="categoria-grid-section">
                    <h2 class="secao-titulo">O que você quer hoje?</h2>
                    <div class="categoria-grid" id="categoria-grid"></div>
                </div>
            </div>

            <!-- ====== VIEW: CATEGORIA ====== -->
            <div id="view-categoria" class="view">
                <div class="categoria-header">
                    <button class="btn-voltar" id="btn-voltar">
                        <i class="fas fa-arrow-left"></i> Início
                    </button>
                    <div class="categoria-titulo-wrapper" id="categoria-titulo-wrapper"></div>
                </div>
                <div id="banner-contextual"></div>
                <div id="itens-grid"></div>
            </div>

        </div>
    </div>

    <div id="modal-container"></div>
    <div id="notificacao" class="notificacao"></div>

    <!-- Bottom Nav (mobile) -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="bottom-nav-item ativo" id="btn-bottom-home" onclick="navegarHome()">
            <span class="bottom-nav-icon-wrapper">
                <i class="fas fa-home"></i>
            </span>
            <span>Início</span>
        </button>
        <button class="bottom-nav-item" id="bottom-carrinho-btn">
            <span class="bottom-nav-icon-wrapper">
                <i class="fas fa-shopping-cart"></i>
                <span class="bottom-nav-badge" id="bottom-nav-badge" style="display:none">0</span>
            </span>
            <span>Carrinho</span>
        </button>
    </nav>

    <!-- FAB carrinho (desktop) -->
    <button class="carrinho-fab" id="fab-carrinho">
        <i class="fas fa-shopping-cart"></i>
        <span id="fab-contador-carrinho">0</span>
    </button>

    <footer id="footer-cardapio"><p>Cardápio Digital</p></footer>

    <script src="assets/js/cardapio.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
