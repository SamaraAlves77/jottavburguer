<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JottaV Burguer</title>

    <link rel="icon" type="image/png" href="assets/img/hamburguer.png">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/tema.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/cardapio.css">
    <link rel="stylesheet" href="assets/css/modal.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <!-- 🔝 NAVBAR -->
    <header id="navbar-container"></header>

    <!-- 🎞️ CARROSSEL -->
    <section class="carrossel-container">
        <div class="carrossel">
            <div class="slide">🔥 Promoção 1</div>
            <div class="slide">🍔 Mais vendidos</div>
            <div class="slide">🎯 Combos especiais</div>
        </div>
    </section>

    <!-- ⚡ AÇÕES RÁPIDAS -->
    <section class="acoes-rapidas">
        <button class="acao-btn">🍔 Monte seu combo</button>
        <button class="acao-btn">🍟 Monte sua batata</button>
    </section>

    <!-- 🧭 CATEGORIAS -->
    <section class="categorias-sticky">
        <div id="navbar-pills-container" class="categorias-pills"></div>
    </section>

    <!-- 📦 CONTEÚDO -->
    <main id="main-content-container"></main>

    <!-- 🛒 MODAIS -->
    <div id="modal-container"></div>

    <!-- 🔔 NOTIFICAÇÃO -->
    <div id="notificacao" class="notificacao"></div>

    <!-- 🛒 FAB -->
    <button class="carrinho-fab" id="fab-carrinho">
        <i class="fas fa-shopping-cart"></i>
        <span id="fab-contador-carrinho">0</span>
    </button>

    <!-- ⚠️ FOOTER -->
    <footer id="footer-cardapio">
        <p>© JottaV Burguer</p>
    </footer>

    <!-- JS -->
    <script src="assets/js/cardapio.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
